name: Mentorsy content

# The engine sits at the repo root because GitHub's web uploader flattens
# folders. Content is generated here rather than uploaded: the engine is
# deterministic, so rebuilding on the runner is cheaper and far less fragile
# than pushing hundreds of rendered files up from a desktop.
#
# Times are UTC. 03:30 UTC is 09:00 IST and 15:00 UTC is 20:30 IST - the
# school run in Dubai, and the one evening hour that is also afternoon in
# London and morning in New York.

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "build or publish"
        default: "build"
      days:
        description: "days to build"
        default: "30"
      dry_run:
        description: "publish: true lists only, false actually posts"
        default: "true"

permissions:
  contents: write

concurrency:
  group: mentorsy-content
  cancel-in-progress: false

jobs:
  build:
    if: github.event.schedule == '0 1 * * *' || github.event.inputs.job == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow requests
      - name: Build content
        run: |
          mkdir -p content
          python build.py --root content --days ${{ github.event.inputs.days || 30 }}
      - name: Commit artwork
        if: always()
        run: |
          git config user.name "mentorsy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "content: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

  publish:
    if: github.event.schedule == '30 3 * * *' || github.event.schedule == '0 15 * * *' || github.event.inputs.job == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: Publish what is due
        env:
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python publish.py --root content --due --dry-run
          else
            python publish.py --root content --due
          fi
      - name: Record what went out
        if: always()
        run: |
          git config user.name "mentorsy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A published.json || true
          git diff --staged --quiet || git commit -m "published: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
