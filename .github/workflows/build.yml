name: Build reels

# Renders any reels due in the next 10 days and commits them back to the repo.
# Runs on GitHub's servers. Your laptop can be shut, or in a different country.

on:
  schedule:
    # 02:00 UTC daily = 06:00 Gulf time. Cron on GitHub is UTC only.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      horizon_days:
        description: "How many days ahead to render"
        default: "10"
      force_all:
        description: "Render everything in the calendar (slow, ~3h)"
        type: boolean
        default: false

concurrency:
  group: build-reels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: pip install -q -r requirements.txt

      - name: Write scripts for anything missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scriptgen.py

      - name: Render upcoming reels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HORIZON_DAYS: ${{ github.event.inputs.horizon_days || '10' }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: python ci_build.py

      - name: Commit finished videos
        run: |
          git config user.name  "sjk-reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A output scripts
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "build: reels for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: python run_all.py --status >> $GITHUB_STEP_SUMMARY
