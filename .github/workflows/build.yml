name: Build reels

# Renders reels due soon and commits them back to the repo.
# Runs on GitHub's servers. Your laptop can be shut.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      horizon_days:
        description: "How many days ahead to render"
        default: "10"
      force_all:
        description: "Render the whole calendar (slow)"
        type: boolean
        default: false

concurrency:
  group: build-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Write scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scriptgen.py
      - name: Render reels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HORIZON_DAYS: ${{ inputs.horizon_days }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: python ci_build.py
      - name: Commit results
        run: |
          git config user.name "mentorsy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A output scripts calendar_60.csv || true
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "build: reels"
            git push
          fi
