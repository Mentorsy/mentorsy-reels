name: Post to Instagram and Facebook

# Checks every hour for anything due and publishes it.

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would post without publishing"
        type: boolean
        default: true

concurrency:
  group: post-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Publish anything due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLIC_VIDEO_BASE_URL: ${{ secrets.PUBLIC_VIDEO_BASE_URL }}
          TZ_OFFSET_HOURS: "4"
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            python post.py --due
          else
            python post.py --due --dry-run
          fi
      - name: Commit the posting log
        run: |
          git config user.name "mentorsy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_log.csv || true
          if git diff --staged --quiet; then
            echo "Nothing posted."
          else
            git commit -m "post"
            git push
          fi
